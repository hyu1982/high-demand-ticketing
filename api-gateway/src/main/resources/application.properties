# ============================================================
# High Demand API Gateway
# ============================================================

# Gateway listens for client requests on port 8080
server.port=8060


# ============================================================
# Ticketing API Route
# ============================================================

# Unique route identifier
spring.cloud.gateway.server.webflux.routes[0].id=ticketing-api

# Existing Ticketing API
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8061

# Forward ticketing requests to the Ticketing API
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/tickets/**

#following no longer needed as redis will keep trying until it is back online
#spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
#spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
#spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=10
#spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
#spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}

# ============================================================
# CORS - Angular development frontend
# ============================================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[1]=Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[2]=Accept
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[3]=Idempotency-Key
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

# ============================================================
# Authentication API Route
# ============================================================
spring.cloud.gateway.server.webflux.routes[1].id=authentication-api
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8061
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

# ============================================================
# Actuator
# ============================================================

# Expose health and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show health details
management.endpoint.health.show-details=when_authorized

spring.data.redis.host=localhost
spring.data.redis.port=6379