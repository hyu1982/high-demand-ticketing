spring.application.name=highdemand-ticketing
server.port=8061
spring.datasource.url=${JDBCTicketingDemoURL}

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Show Flyway activity
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

#jwt.secret=VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC1mb3ItdGhlLXRpY2V0aW5nLWFwaQ==
jwt.secret=This-is-my-super-secret-jwt-protected-key

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.kafka.bootstrap-servers=localhost:9082
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.kafka.enabled=true

spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=6000
spring.kafka.producer.properties.retries=0
spring.kafka.producer.properties.max.block.ms=5000

spring.kafka.consumer.group-id=order-notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=demo.highdemand.ticketing.event
spring.kafka.consumer.properties.spring.json.value.default.type=demo.highdemand.ticketing.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

management.endpoints.web.exposure.include=health,metrics

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

resilience4j.circuitbreaker.instances.ticketBackend.slidingWindowSize=10
resilience4j.circuitbreaker.instances.ticketBackend.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.ticketBackend.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ticketBackend.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.ticketBackend.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.redisCache.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisCache.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redisCache.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisCache.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisCache.permittedNumberOfCallsInHalfOpenState=2

resilience4j.bulkhead.instances.redisCacheGet.maxConcurrentCalls=20
resilience4j.bulkhead.instances.redisCacheGet.maxWaitDuration=0ms

resilience4j.bulkhead.instances.redisCacheLock.maxConcurrentCalls=5
resilience4j.bulkhead.instances.redisCacheLock.maxWaitDuration=0ms